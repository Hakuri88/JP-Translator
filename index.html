<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>JP ↔ ID Translator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #111827;
    }
    .app { width: min(760px, 100%); margin: 0 auto; min-height: 100vh; padding: 20px 16px 40px; }
    .hero { padding: 18px 4px 14px; }
    .eyebrow { font-size: 13px; font-weight: 700; color: #4b5563; letter-spacing: .02em; }
    h1 { margin: 8px 0 6px; font-size: clamp(28px, 6vw, 42px); line-height: 1.05; }
    .sub { margin: 0; color: #6b7280; line-height: 1.5; }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(17,24,39,.05);
      margin-top: 14px;
    }
    textarea {
      width: 100%;
      min-height: 155px;
      resize: vertical;
      border: 0;
      outline: 0;
      font: inherit;
      font-size: 18px;
      line-height: 1.55;
      color: #111827;
      background: transparent;
    }
    textarea::placeholder { color: #9ca3af; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .primary { background: #111827; color: white; flex: 1; min-width: 150px; }
    .secondary { background: #eef0f4; color: #374151; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status { color: #6b7280; font-size: 14px; min-height: 20px; margin: 10px 2px 0; }
    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .result-head h2 { margin: 0; font-size: 17px; }
    .output {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 17px;
      line-height: 1.75;
      min-height: 80px;
    }
    .hidden { display: none; }
    .hint {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 13px;
      line-height: 1.5;
    }
    @media (max-width: 520px) {
      .app { padding: 14px 12px 28px; }
      .card { border-radius: 18px; }
      textarea { min-height: 135px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="eyebrow">🇯🇵 ↔ 🇮🇩 AI TRANSLATOR</div>
      <h1>Japanese Translator</h1>
      <p class="sub">Tulis Indonesia, Jepang, atau bahasa lain. AI akan memilih format terjemahan yang sesuai.</p>
    </section>

    <section class="card">
      <textarea id="inputText" placeholder="Contoh: aku ingin belajar"></textarea>
      <div class="row">
        <button class="primary" id="translateBtn">Translate</button>
        <button class="secondary" id="clearBtn">Clear</button>
      </div>
      <div class="status" id="status"></div>
    </section>

    <section class="card hidden" id="resultCard">
      <div class="result-head">
        <h2>Hasil</h2>
        <button class="secondary" id="copyBtn">Copy</button>
      </div>
      <div class="output" id="output"></div>
    </section>

    <div class="hint">
      V1: Indonesia/bahasa lain → 3 versi Jepang (Formal, Teman, Normal). Jepang → Indonesia + romaji + catatan bila perlu.
    </div>
  </main>

  <script>
    const WEBHOOK_URL = "https://cabinet-craig-rebel-consent.trycloudflare.com/webhook/translate";

    const inputText = document.getElementById('inputText');
    const translateBtn = document.getElementById('translateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');
    const resultCard = document.getElementById('resultCard');

    async function translate() {
      const text = inputText.value.trim();

      if (!text) {
        statusEl.textContent = 'Masukkan teks terlebih dahulu.';
        inputText.focus();
        return;
      }

      translateBtn.disabled = true;
      clearBtn.disabled = true;
      statusEl.textContent = 'Menerjemahkan…';
      resultCard.classList.add('hidden');

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);

      try {
        // Form encoded = tidak memicu CORS preflight, lebih aman untuk webhook n8n lokal.
        const body = new URLSearchParams();
        body.set('text', text);

        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
          },
          body,
          signal: controller.signal
        });

        if (!res.ok) {
          const detail = await res.text().catch(() => '');
          throw new Error(`HTTP ${res.status}${detail ? ': ' + detail : ''}`);
        }

        const data = await res.json();
        const translation = data?.translation ?? data?.text ?? JSON.stringify(data, null, 2);

        outputEl.textContent = translation;
        resultCard.classList.remove('hidden');
        statusEl.textContent = 'Selesai.';
      } catch (err) {
        console.error(err);
        statusEl.textContent = err.name === 'AbortError'
          ? 'Request terlalu lama. Coba lagi.'
          : 'Gagal terhubung. Pastikan workflow n8n aktif dan Cloudflare Tunnel masih menyala.';
      } finally {
        clearTimeout(timeout);
        translateBtn.disabled = false;
        clearBtn.disabled = false;
      }
    }

    translateBtn.addEventListener('click', translate);

    inputText.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') translate();
    });

    clearBtn.addEventListener('click', () => {
      inputText.value = '';
      outputEl.textContent = '';
      resultCard.classList.add('hidden');
      statusEl.textContent = '';
      inputText.focus();
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(outputEl.textContent);
        const old = copyBtn.textContent;
        copyBtn.textContent = 'Copied';
        setTimeout(() => copyBtn.textContent = old, 1200);
      } catch {
        statusEl.textContent = 'Tidak bisa copy otomatis di browser ini.';
      }
    });
  </script>
</body>
</html>
