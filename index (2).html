<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
  <title>Japanese Translator V2</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f5f7fb; --panel:#fff; --panel2:#f1f4f8; --text:#111827;
      --muted:#6b7280; --border:#e5e7eb; --accent:#111827; --accentText:#fff;
      --shadow:0 12px 32px rgba(17,24,39,.07); --danger:#b42318;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg:#0b0f17; --panel:#121824; --panel2:#192130; --text:#f3f4f6;
      --muted:#9ca3af; --border:#263244; --accent:#f3f4f6; --accentText:#111827;
      --shadow:0 12px 32px rgba(0,0,0,.28); --danger:#ff8b82;
    }
    html[data-theme="light"] { color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] {
        color-scheme: dark;
        --bg:#0b0f17; --panel:#121824; --panel2:#192130; --text:#f3f4f6;
        --muted:#9ca3af; --border:#263244; --accent:#f3f4f6; --accentText:#111827;
        --shadow:0 12px 32px rgba(0,0,0,.28); --danger:#ff8b82;
      }
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{width:min(820px,100%);min-height:100vh;margin:0 auto;padding:18px 16px 44px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}
    .theme,.secondary,.copy{border:1px solid var(--border);background:var(--panel2);color:var(--text)}
    .theme{border-radius:12px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}
    .hero{padding:10px 2px 8px}
    .eyebrow{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.08em}
    h1{margin:7px 0;font-size:clamp(30px,7vw,48px);line-height:1.03;letter-spacing:-.035em}
    .sub{margin:0;color:var(--muted);line-height:1.55;max-width:620px}
    .panel,.result-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}
    .panel{margin-top:16px;padding:16px}
    textarea{width:100%;min-height:150px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:18px;line-height:1.6}
    textarea::placeholder{color:var(--muted)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
    button{appearance:none;border:0;font:inherit;font-weight:800;cursor:pointer}
    .primary{flex:1;min-width:170px;padding:13px 18px;border-radius:14px;background:var(--accent);color:var(--accentText)}
    .secondary{padding:12px 15px;border-radius:13px}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{min-height:20px;margin-top:10px;color:var(--muted);font-size:14px}
    .status.error{color:var(--danger)}
    .results{display:grid;gap:12px;margin-top:16px}
    .result-card{padding:16px}
    .card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
    .label{font-size:14px;font-weight:850}
    .copy{padding:8px 11px;border-radius:10px;font-size:13px}
    .jp{font-size:21px;line-height:1.75;word-break:break-word}
    .romaji{margin-top:7px;color:var(--muted);font-size:15px;line-height:1.55;word-break:break-word}
    .indo{font-size:20px;line-height:1.65}
    .note{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--panel2);color:var(--muted);line-height:1.5;font-size:14px}
    .hidden{display:none!important}
    @media(max-width:520px){.app{padding:14px 12px 34px}.panel,.result-card{border-radius:17px}textarea{min-height:130px}.jp,.indo{font-size:19px}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">🇯🇵 ↔ 🇮🇩 <span>JP Translator</span></div>
    <button id="themeBtn" class="theme" type="button">🖥️ System</button>
  </header>

  <section class="hero">
    <div class="eyebrow">V2 · AI TRANSLATOR</div>
    <h1>Japanese Translator</h1>
    <p class="sub">Indonesia ↔ Jepang dengan tiga gaya bahasa, furigana, romaji, dan validator tambahan untuk input Jepang.</p>
  </section>

  <section class="panel">
    <textarea id="inputText" placeholder="Contoh: aku ingin belajar / 完成 / 日本で働きたいです"></textarea>
    <div class="actions">
      <button id="translateBtn" class="primary" type="button">Translate</button>
      <button id="clearBtn" class="secondary" type="button">Clear</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section id="results" class="results hidden">
    <article id="formalCard" class="result-card hidden">
      <div class="card-head"><div class="label">🎩 Formal</div><button class="copy" data-copy="formal">Copy</button></div>
      <div id="formalJp" class="jp"></div><div id="formalRomaji" class="romaji"></div>
    </article>
    <article id="casualCard" class="result-card hidden">
      <div class="card-head"><div class="label">👥 Teman</div><button class="copy" data-copy="casual">Copy</button></div>
      <div id="casualJp" class="jp"></div><div id="casualRomaji" class="romaji"></div>
    </article>
    <article id="normalCard" class="result-card hidden">
      <div class="card-head"><div class="label">💬 Normal</div><button class="copy" data-copy="normal">Copy</button></div>
      <div id="normalJp" class="jp"></div><div id="normalRomaji" class="romaji"></div>
    </article>
    <article id="indoCard" class="result-card hidden">
      <div class="card-head"><div class="label">🇮🇩 Indonesia</div><button class="copy" data-copy="indo">Copy</button></div>
      <div id="indoText" class="indo"></div>
      <div id="sourceFurigana" class="jp" style="margin-top:12px"></div>
      <div id="sourceRomaji" class="romaji"></div>
      <div id="note" class="note hidden"></div>
    </article>
  </section>
</main>

<script>
const WEBHOOK_URL="https://cabinet-craig-rebel-consent.trycloudflare.com/webhook/translate-v2";
const $=id=>document.getElementById(id);
const inputText=$("inputText"), translateBtn=$("translateBtn"), clearBtn=$("clearBtn"), statusEl=$("status"), results=$("results");

const themeOrder=["system","light","dark"];
const themeLabels={system:"🖥️ System",light:"☀️ Light",dark:"🌙 Dark"};
function setTheme(theme){
  document.documentElement.dataset.theme=theme;
  localStorage.setItem("jp-translator-theme",theme);
  $("themeBtn").textContent=themeLabels[theme];
}
setTheme(localStorage.getItem("jp-translator-theme")||"system");
$("themeBtn").addEventListener("click",()=>{
  const cur=document.documentElement.dataset.theme||"system";
  setTheme(themeOrder[(themeOrder.indexOf(cur)+1)%themeOrder.length]);
});

function hideAll(){
  ["formalCard","casualCard","normalCard","indoCard"].forEach(id=>$(id).classList.add("hidden"));
  $("note").classList.add("hidden");
}
function showJa(o){
  [["formal","formalCard","formalJp","formalRomaji"],["casual","casualCard","casualJp","casualRomaji"],["normal","normalCard","normalJp","normalRomaji"]]
  .forEach(([k,c,j,r])=>{
    const item=o[k]||{};
    if(item.japanese||item.romaji){$(j).textContent=item.japanese||"";$(r).textContent=item.romaji||"";$(c).classList.remove("hidden");}
  });
}
function showId(o){
  const a=o.japanese_analysis||{};
  $("indoText").textContent=a.indonesian||"";
  $("sourceFurigana").textContent=a.furigana||a.source_japanese||"";
  $("sourceRomaji").textContent=a.romaji||"";
  if(a.note){$("note").textContent="⚠️ "+a.note;$("note").classList.remove("hidden");}
  $("indoCard").classList.remove("hidden");
}
function render(data){
  const o=data?.output||data;
  hideAll();
  if(!o||typeof o!=="object") throw new Error("Invalid response");
  if(o.direction==="ja_to_id"||o.direction==="mixed_to_id") showId(o); else showJa(o);
  results.classList.remove("hidden");
}

async function translate(){
  const text=inputText.value.trim();
  if(!text){statusEl.className="status error";statusEl.textContent="Masukkan teks terlebih dahulu.";return;}
  statusEl.className="status";statusEl.textContent="Menerjemahkan…";translateBtn.disabled=true;clearBtn.disabled=true;results.classList.add("hidden");
  const started=performance.now();
  try{
    const body=new URLSearchParams(); body.set("text",text);
    const res=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body});
    if(!res.ok){const detail=await res.text().catch(()=> "");throw new Error(`HTTP ${res.status}${detail?": "+detail:""}`);}
    const data=await res.json(); render(data);
    statusEl.textContent=`Selesai · ${((performance.now()-started)/1000).toFixed(2)}s`;
  }catch(err){
    console.error(err); statusEl.className="status error"; statusEl.textContent="Gagal terhubung ke translator. Pastikan backend V2 aktif.";
  }finally{translateBtn.disabled=false;clearBtn.disabled=false;}
}
translateBtn.addEventListener("click",translate);
inputText.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter") translate();});
clearBtn.addEventListener("click",()=>{inputText.value="";hideAll();results.classList.add("hidden");statusEl.textContent="";statusEl.className="status";inputText.focus();});

document.querySelectorAll("[data-copy]").forEach(btn=>{
  btn.addEventListener("click",async()=>{
    const type=btn.dataset.copy; let text="";
    if(type==="indo"){text=[$("indoText").textContent,$("sourceFurigana").textContent,$("sourceRomaji").textContent].filter(Boolean).join("\n");}
    else{
      const map={formal:["formalJp","formalRomaji"],casual:["casualJp","casualRomaji"],normal:["normalJp","normalRomaji"]};
      text=map[type].map(id=>$(id).textContent).filter(Boolean).join("\n");
    }
    try{await navigator.clipboard.writeText(text);const old=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=old,1100);}
    catch{statusEl.className="status error";statusEl.textContent="Browser tidak mengizinkan copy otomatis.";}
  });
});
</script>
</body>
</html>
